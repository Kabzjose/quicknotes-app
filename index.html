<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quick Notes</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header>
    <h1>Quick Notes</h1>
    <p>Capture your thoughts quickly and keep them organized.</p>
  </header>

  <main>
    <section aria-labelledby="add-note-heading">
      <h2 id="add-note-heading">Add a note</h2>
      <form id="note-form">
        <label for="note-input">Note</label>
        <input id="note-input" name="note" type="text" required>

        <label for="note-category">Category</label>
        <select id="note-category" name="category">
          <option value="Personal">Personal</option>
          <option value="Work">Work</option>
          <option value="Study">Study</option>
        </select>

        <button type="submit">Add Note</button>
      </form>
      <p id="error-message"></p>
    </section>

    <section aria-labelledby="your-notes-heading">
      <h2 id="your-notes-heading">Your notes</h2>
      <label for="search-input">Search notes</label>
      <input id="search-input" name="search" type="search">
      <p id="note-count"></p>
      <button id="clear-all" type="button">Clear all</button>
      <ul id="notes-list"></ul>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Quick Notes</p>
  </footer>
</body>
</html>
